name: Angular CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # 1. BUILD ANGULAR APPLICATION
  # ==========================================
  build:
    name: Build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./my-angular-app

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build


  # ==========================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ==========================================
  docker:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/myfrontend:${{ github.sha }} \
            ./my-angular-app

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/myfrontend:${{ github.sha }}


  # ==========================================
  # 3. DEPLOY TO LOCAL MINIKUBE
  # ==========================================
  deploy:
    name: Deploy to Minikube
    needs: docker
    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for Minikube
        run: |
          docker build \
            -t myfrontend:${{ github.sha }} \
            ./my-angular-app

      - name: Load image into Minikube
        run: |
          minikube image load myfrontend:${{ github.sha }}

      - name: Update Kubernetes deployment
        run: |
          kubectl set image deployment/myfrontend-deployment \
            myfrontend-container=myfrontend:${{ github.sha }}

      - name: Wait for Kubernetes rollout
        run: |
          kubectl rollout status deployment/myfrontend-deployment

