name: Angular CI/CD

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # CI - Build and Test
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build


  # =========================
  # CI - Docker Build
  # =========================
  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/myfrontend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/myfrontend:${{ github.sha }}


  # =========================
  # CD - Kubernetes Deploy
  # =========================
  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Kubernetes image
        run: |
          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/myfrontend:${{ github.sha }}|" deployment.yml

      - name: Deploy to Kubernetes
        run: |
          echo "Kubernetes deployment would happen here"
